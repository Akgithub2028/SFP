name: Build Paper

on:
  push:
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  pull_request:
    paths:
      - "paper/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build paper (Docker)
        run: |
          docker build -t sfp-latex paper/
          docker run --rm -v ${{ github.workspace }}/paper:/paper sfp-latex
          cp paper/build/main.pdf sfp.pdf
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: sfp.pdf
          path: sfp.pdf
