name: Deploy Dashboard

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "leaderboard.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, sfp]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build
        run: npm ci && npm run build
        working-directory: web

      - name: Deploy
        run: |
          rm -rf /home/ubuntu/sfp-dashboard/*
          cp -r web/dist/* /home/ubuntu/sfp-dashboard/
          echo "Deployed to /home/ubuntu/sfp-dashboard"
