[project]
name = "sfp"
version = "0.1.0"
description = "SFP — ML paper monorepo (LaTeX + Python experiments)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "numpy",
    "matplotlib",
    "pandas",
    "scipy",
    "tqdm",
    "wandb",
    "paperbanana",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "ipython",
    "jupyter",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["sfp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
