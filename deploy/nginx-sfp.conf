server {
    listen 8080;
    server_name _;

    root /home/ubuntu/sfp-dashboard;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Submission API
    location /submit {
        proxy_pass http://localhost:8090;
        proxy_set_header Host $host;
        proxy_read_timeout 120;
    }
    location /status/ {
        proxy_pass http://localhost:8090;
        proxy_set_header Host $host;
    }
    location /leaderboard {
        proxy_pass http://localhost:8090;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /submissions {
        proxy_pass http://localhost:8090;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    # Prometheus query API (dashboard charts)
    location /api/v1/ {
        proxy_pass http://localhost:9090/api/v1/;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    # Prometheus pushgateway (Modal pushes metrics here, token-gated)
    location /metrics/job/ {
        if ($http_x_push_token != "SFP_PUSH_TOKEN_PLACEHOLDER") {
            return 403;
        }
        proxy_pass http://localhost:9091/metrics/job/;
        proxy_set_header Host $host;
    }
}
